name: npx probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve the bin without running it
        run: |
          npm install --no-save --silent @perrylink/dsh-plugin-doctor@0.3.2 >/dev/null 2>&1 || true
          echo "== .bin entry =="
          ls -la node_modules/.bin/ || true
          echo "== target file mode =="
          ls -la node_modules/@perrylink/dsh-plugin-doctor/doctor.mjs || true
          echo "== is it a symlink or a shim? =="
          file node_modules/.bin/dsh-plugin-doctor 2>/dev/null || true
      - name: Invoke as CI does
        run: |
          out="$(npx --yes @perrylink/dsh-plugin-doctor@0.3.2 --version 2>&1)"; rc=$?
          echo "exit=$rc"
          printf '%s\n' "$out" | head -5
