name: action consumer check (temporary)

on:
  workflow_dispatch:

jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Exactly what a third-party repository would write in its own workflow.
      - uses: PerryLink/dsh-plugin-doctor@v0.4.2
        id: doctor
        with:
          only: R,K
      - run: |
          echo "verdict=${{ steps.doctor.outputs.verdict }}"
          echo "summary=${{ steps.doctor.outputs.summary }}"
          echo "exit=${{ steps.doctor.outputs.exit-code }}"
          for v in "${{ steps.doctor.outputs.verdict }}" "${{ steps.doctor.outputs.summary }}" "${{ steps.doctor.outputs.exit-code }}"; do
            [ -n "$v" ] || { echo "::error::an output is empty"; exit 1; }
          done
          echo "consumer received all outputs"
