# Refreshes the dsh-doctor verified registry and one badge per declared repo.
# Verification reads the GitHub API only (gate config + the run on HEAD); no
# third-party code is cloned or executed. A repo that stops passing the gate
# turns red on the next run instead of keeping a stale green badge.
name: verified badges

on:
  push:
    branches: [main]
    paths:
      - 'data/verified-repos.json'
      - 'scripts/**'
      - '.github/workflows/verified.yml'
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: verified-badges
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify declared repos (static R+K)
        env:
          # Cross-repo reads need a token that can see other repositories; the
          # workflow-scoped GITHUB_TOKEN is rate-limited as an anonymous caller.
          # Falls back to GITHUB_TOKEN when the secret is absent.
          DOCTOR_AUDIT_TOKEN: ${{ secrets.DOCTOR_AUDIT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify.mjs
      - name: Commit registry and badges
        # Runs even when verification failed (e.g. an expired audit token): the
        # grey "cannot verify" registry is the honest record, and the job still
        # ends red so the failure is noticed.
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if [ -z "$(git status --porcelain data badges)" ]; then
            echo 'verified registry unchanged'
            exit 0
          fi
          git add data/verified.json badges
          git commit -m 'chore: refresh verified badges'
          # A concurrent human push can land while this job runs; rebase and retry.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push attempt ${attempt} failed; retrying"
            sleep 5
          done
          echo '::error::could not push the refreshed registry after 3 attempts'
          exit 1
