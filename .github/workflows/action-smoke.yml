name: action smoke (temporary)

on:
  workflow_dispatch:

jobs:
  use-the-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the released Action exactly as a consumer would
        id: doctor
        uses: PerryLink/dsh-plugin-doctor@v0.4.1
        with:
          only: R,K
          format: doctor
      - name: DIAGNOSTIC - what does the runner think the step produced?
        run: |
          echo "--- toJSON(steps.doctor) ---"
          echo '${{ toJSON(steps.doctor) }}'
          echo "--- individual outputs ---"
          echo "verdict='${{ steps.doctor.outputs.verdict }}'"
          echo "summary='${{ steps.doctor.outputs.summary }}'"
          echo "outcome='${{ steps.doctor.outcome }}'"
      - name: DIAGNOSTIC - can a consumer read the report itself instead?
        run: |
          f="doctor-report/doctor.json"
          echo "report exists: $([ -f "$f" ] && echo yes || echo no)"
          if [ -f "$f" ]; then
            node -e '
              const r = JSON.parse(require("fs").readFileSync("doctor-report/doctor.json","utf8"))
              const w = r.verdict && (typeof r.verdict === "string" ? r.verdict : r.verdict.worst)
              const rows = r.results || r.checks || []
              const bad = rows.filter(x => !/^R[24] /.test(x.name) && /^(fail|error)$/i.test(x.status))
              console.log("verdict-from-file=" + w + " failing=" + bad.map(x=>x.id).join(","))
            '
          fi
