name: action smoke (temporary)

on:
  workflow_dispatch:

jobs:
  use-the-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the released Action exactly as a consumer would
        id: doctor
        uses: PerryLink/dsh-plugin-doctor@v0.4.2
        with:
          only: R,K
          format: doctor
      - name: every output must be non-empty
        run: |
          fail=0
          for pair in "verdict:${{ steps.doctor.outputs.verdict }}" \
                      "exit-code:${{ steps.doctor.outputs.exit-code }}" \
                      "summary:${{ steps.doctor.outputs.summary }}" \
                      "report-path:${{ steps.doctor.outputs.report-path }}"; do
            name="${pair%%:*}"; val="${pair#*:}"
            echo "$name = '$val'"
            if [ -z "$val" ]; then echo "::error::output '$name' is empty"; fail=1; fi
          done
          echo "failing = '${{ steps.doctor.outputs.failing }}'  (empty is correct when the gate passes)"
          v="${{ steps.doctor.outputs.verdict }}"
          case "$v" in
            pass|warn|skip|fail|error) echo "verdict is a recognised value: $v" ;;
            *"[object"*) echo "::error::verdict is malformed: $v"; fail=1 ;;
            *) echo "::error::unrecognised verdict: '$v'"; fail=1 ;;
          esac
          exit $fail
