name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        shell: bash
        run: |
          node --check doctor.mjs
          for f in lib/*.mjs scripts/*.mjs tests/*.mjs; do node --check "$f"; done
      - name: Self-test (fixtures + exit-code contract)
        run: node tests/selftest.mjs
      # The 37 family repositories grep this tool's stdout and read its JSON; a
      # rename or a "cleanup" of those observables turns all of them red at once.
      # tests/contract.mjs freezes them, so it must run on every push — not only
      # inside the publish workflow, where the break would already be shipped.
      - name: Contract test (frozen family-CI observables)
        run: node tests/contract.mjs
      - name: Pack check
        run: npm pack --dry-run
