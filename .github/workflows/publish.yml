name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub Release
  id-token: write # npm provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  publish:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Verify the tag matches the package version
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${tag}"
            exit 1
          fi
      - name: Publish to npm
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ -z "$NPM_TOKEN" ]; then
            # Exiting 0 here would make a release that published nothing look green —
            # exactly the silent-pass class this tool exists to catch.
            echo "::error::NPM_TOKEN secret is not set; refusing to report a release that published nothing"
            exit 1
          fi
          if npm view "@perrylink/dsh-plugin-doctor@${version}" version >/dev/null 2>&1; then
            echo "@perrylink/dsh-plugin-doctor@${version} is already published; skipping npm publish"
          else
            npm publish --access public --provenance
          fi
      # Advisory only: npm's read side can lag minutes behind a successful publish, and a hard
      # failure here skipped the GitHub Release (observed on dsh-cert-mcp v0.2.1).
      - name: Verify the version is live on the registry (advisory)
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 12); do
            if npm view "@perrylink/dsh-plugin-doctor@${version}" version >/dev/null 2>&1; then
              echo "@perrylink/dsh-plugin-doctor@${version} is live on the registry"
              exit 0
            fi
            echo "attempt ${attempt}: not visible on the registry yet; retrying"
            sleep 15
          done
          echo "::warning::@perrylink/dsh-plugin-doctor@${version} is still not visible on the registry after ~3 minutes (the publish step reported success; npm's read side is lagging)"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
