name: npx probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: A. current form, from the checkout (fails)
        run: |
          set +e
          out="$(npx --yes @perrylink/dsh-plugin-doctor@0.3.2 --repo . --no-smoke --only "R,K" --json /tmp/a.json 2>&1)"
          echo "exit=$? :: json=$([ -f /tmp/a.json ] && echo yes || echo no) :: R0=$(printf '%s' "$out" | grep -c 'R0 ' || true)"

      - name: B. run npx from /tmp, point --repo back at the checkout (absolute)
        run: |
          set +e
          cd /tmp
          out="$(npx --yes @perrylink/dsh-plugin-doctor@0.3.2 --repo "$GITHUB_WORKSPACE" --no-smoke --only "R,K" --json /tmp/b.json 2>&1)"
          echo "exit=$? :: json=$([ -f /tmp/b.json ] && echo yes || echo no) :: R0=$(printf '%s' "$out" | grep -c 'R0 ' || true)"
          printf '%s\n' "$out" | head -4

      - name: C. same, but invoking doctor.mjs directly by path (no bin resolution at all)
        run: |
          set +e
          cd /tmp
          npm install --no-save --silent @perrylink/dsh-plugin-doctor@0.3.2 >/dev/null 2>&1
          cli="/tmp/node_modules/@perrylink/dsh-plugin-doctor/doctor.mjs"
          echo "cli present: $([ -f "$cli" ] && echo yes || echo no)"
          out="$(node "$cli" --repo "$GITHUB_WORKSPACE" --no-smoke --only "R,K" --json /tmp/c.json 2>&1)"
          echo "exit=$? :: json=$([ -f /tmp/c.json ] && echo yes || echo no) :: R0=$(printf '%s' "$out" | grep -c 'R0 ' || true)"
