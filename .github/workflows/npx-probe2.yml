name: npx probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: A. the gate's exact invocation, from this checkout
        run: |
          echo "== pwd: $(pwd) =="
          echo "== does the checkout carry a package.json with a bin? =="
          node -p "JSON.stringify(require('./package.json').bin)"
          echo "== any node_modules already here? =="
          ls -la node_modules 2>&1 | head -3 || true
          echo
          out="$(npx --yes @perrylink/dsh-plugin-doctor@0.3.2 --version 2>&1)"; rc=$?
          echo "exit=$rc"
          printf '%s\n' "$out" | head -8

      - name: B. same invocation with the gate's flags
        run: |
          out="$(npx --yes @perrylink/dsh-plugin-doctor@0.3.2 --repo . --no-smoke --only "R,K" --json /tmp/doctor.json 2>&1)"; rc=$?
          echo "exit=$rc"
          printf '%s\n' "$out" | head -14
          echo "json: $([ -f /tmp/doctor.json ] && echo yes || echo no)"

      - name: C. what npm actually resolved
        run: |
          npm exec --yes --package=@perrylink/dsh-plugin-doctor@0.3.2 -- dsh-plugin-doctor --version 2>&1 | head -5 || true
          echo "--- _npx cache dirs ---"
          ls -la ~/.npm/_npx 2>/dev/null | head -5 || true
          find ~/.npm/_npx -name 'dsh-plugin-doctor' -maxdepth 4 2>/dev/null | head -5 || true
