name: npx probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: A. inside this checkout (the failing case)
        run: |
          set +e
          echo "== npm $(npm --version), node $(node --version), pwd $(pwd) =="
          echo "--- full stderr, unfiltered ---"
          out="$(npx --yes @perrylink/dsh-plugin-doctor@0.3.2 --version 2>&1)"; rc=$?
          echo "exit=$rc"
          printf '%s\n' "$out"
          echo "--- end ---"

      - name: B. same command in an empty directory (the working case)
        run: |
          set +e
          mkdir -p /tmp/empty && cd /tmp/empty
          out="$(npx --yes @perrylink/dsh-plugin-doctor@0.3.2 --version 2>&1)"; rc=$?
          echo "exit=$rc"
          printf '%s\n' "$out" | head -6

      - name: C. inside the checkout again, but with the bin name as the command
        run: |
          set +e
          out="$(npx --yes --package @perrylink/dsh-plugin-doctor@0.3.2 -- dsh-plugin-doctor --version 2>&1)"; rc=$?
          echo "exit=$rc"
          printf '%s\n' "$out" | head -10
